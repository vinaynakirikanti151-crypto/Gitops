apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-executor
  namespace: argo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-executor
  namespace: argo

rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-executor
  namespace: argo

subjects:
  - kind: ServiceAccount
    name: workflow-executor
    namespace: argo

roleRef:
  kind: Role
  name: workflow-executor
  apiGroup: rbac.authorization.k8s.io